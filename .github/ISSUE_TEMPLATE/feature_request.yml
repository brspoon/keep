name: Feature request
description: Suggest a user-facing improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include household data, private artwork, credentials, tokens, database files, or service responses. Report vulnerability details privately using [SECURITY.md](https://github.com/brspoon/keep/blob/main/SECURITY.md). You may request that private reporting be enabled here, but do not include any vulnerability details.
  - type: textarea
    id: need
    attributes:
      label: What user need should this address?
      description: Describe the task in general terms.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Keep to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: safe
    attributes:
      label: Safety check
      options:
        - label: This request contains no private data or credentials and is not a security report.
          required: true
