name: Native Keep architecture gates
on:
  workflow_call:
    inputs:
      qualification:
        type: boolean
        default: false
      prepare_notices:
        type: boolean
        default: true
jobs:
  image:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (inputs.qualification && github.event_name == 'workflow_dispatch' &&
       github.repository == 'brspoon/keep' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/brspoon/')))
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      KEEP_SOURCE_DOWNLOAD_WORKERS: '4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read release metadata
        id: release
        run: |
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build the image to test with temporary registry credentials
        id: build
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PYBUILD'
          import os, subprocess, tempfile
          username = os.environ.pop('DOCKERHUB_USERNAME')
          token = os.environ.pop('DOCKERHUB_TOKEN')
          with tempfile.TemporaryDirectory() as directory:
              env = {**os.environ, 'DOCKER_CONFIG': directory}
              subprocess.run(['docker', 'login', 'dhi.io', '--username', username, '--password-stdin'], input=token, text=True, env=env, check=True)
              subprocess.run(['docker', 'build', '--label', 'org.opencontainers.image.version=' + env['VERSION'], '--label', 'org.opencontainers.image.revision=' + env['GITHUB_SHA'], '--label', 'org.opencontainers.image.source=https://github.com/' + env['GITHUB_REPOSITORY'], '-t', 'keep-ci', '.'], env=env, check=True)
          PYBUILD
      - name: Test installation launcher on the native host
        run: |
          sh -n install.sh
          python3 -B -m unittest discover -s tests -p test_install_launcher.py
      - name: Test Python application and release tools
        run: |
          docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace keep-ci python -B -c "import pathlib, unittest; loader=unittest.TestLoader(); suite=unittest.TestSuite(loader.discover('tests', pattern=p.name) for p in sorted(pathlib.Path('tests').glob('test_*.py')) if p.name not in ('test_deploy.py', 'test_install_launcher.py')); result=unittest.TextTestRunner(verbosity=1).run(suite); raise SystemExit(not result.wasSuccessful())"
      - name: Test JavaScript
        run: docker run --rm --network none -v "$PWD:/workspace:ro" -w /workspace node:24-alpine node --test tests/test_*.cjs
      - name: Verify packaged version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: test "$(docker run --rm --network none keep-ci python -c "from pathlib import Path; print(Path('/app/VERSION').read_text().strip())")" = "$VERSION"
      - name: Verify non-root runtime
        run: test "$(docker run --rm --network none keep-ci python -c 'import os; print(os.getuid())' )" = 10001
      - name: Verify private runtime data directory
        run: |
          docker run --rm --network none keep-ci python -c "import os, stat; s=os.stat('/app/data'); assert s.st_uid == 10001 and stat.S_IMODE(s.st_mode) == 0o700, f'unexpected /app/data owner/mode: {s.st_uid}:{s.st_gid} {stat.S_IMODE(s.st_mode):04o}'"
      - name: Verify installation tools are absent and runtime libraries work
        run: |
          docker run --rm --network none keep-ci python -c "import importlib.util, zlib, sqlite3, ssl; assert all(importlib.util.find_spec(name) is None for name in ('pip', 'ensurepip', 'setuptools', 'msgpack')); assert zlib.decompress(zlib.compress(b'keep')) == b'keep'; assert sqlite3.connect(':memory:').execute('select 1').fetchone() == (1,); assert ssl.create_default_context().get_ca_certs()"
      - name: Validate portable Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Smoke-test packaged web and worker with durable data
        run: sh scripts/smoke_container.sh keep-ci
      - name: Exercise portable installation, restore and failed-upgrade recovery
        run: python3 scripts/portable_container_trial.py --candidate-image keep-ci:latest --evidence portable-recovery-${{ matrix.arch }}.json
      - name: Exercise one-command installation and owner-preserving reruns
        run: python3 scripts/installer_container_trial.py --candidate-image keep-ci:latest --evidence installer-trial-${{ matrix.arch }}.json
      - name: Capture verified vendor evidence and Scout assessment
        id: provenance
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/inspect_candidate.py
      - name: Inventory installed notices and inspect every image layer
        id: inventory
        env:
          KEEP_PRIVATE_IMAGE_MARKERS: ${{ secrets.KEEP_PRIVATE_IMAGE_MARKERS }}
        run: |
          docker run --rm --network none --read-only -v "$PWD/scripts:/checks:ro" keep-ci python -B /checks/image_distribution.py --runtime > candidate-notices-${{ matrix.arch }}.json
          IMAGE_ARCHIVE=$(mktemp)
          trap 'rm -f "$IMAGE_ARCHIVE"' EXIT
          docker save --output "$IMAGE_ARCHIVE" keep-ci
          python3 scripts/image_distribution.py --archive "$IMAGE_ARCHIVE" > candidate-layers-${{ matrix.arch }}.json
      - name: Scan candidate without suppressions
        if: ${{ !cancelled() }}
        run: sh scripts/scan_image.sh keep-ci candidate-${{ matrix.arch }}.json --report-only
      - name: Verify all nine runtime security fixes in the tested image
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m -v "$PWD/scripts:/checks:ro" keep-ci python -B /checks/python_security_checks.py --report > candidate-regression-${{ matrix.arch }}.json
      - name: Verify default Expat and OpenSSL library loading
        run: docker run --rm --network none --read-only -v "$PWD/scripts:/checks:ro" keep-ci python -B /checks/runtime_dependency_checks.py --report > candidate-dependencies-${{ matrix.arch }}.json
      - name: Accept only reviewed fixed findings and block all others
        run: python3 scripts/review_image.py ${{ matrix.arch }}
      - name: Retain full scan and review evidence
        if: always()
        run: python3 scripts/registry_transfer.py report ${{ matrix.arch }}
      - name: Verify Zstandard source-layer decoder is available
        run: zstd --version
      - name: Obtain verified base source materials and license notices
        id: base_sources
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.provenance.outcome == 'success' && steps.inventory.outcome == 'success' && (inputs.qualification || success()) }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: set -o pipefail; python3 scripts/collect_image_sources.py --download --output source-materials | tee source-acquisition-base-${{ matrix.arch }}.log
      - name: Obtain matching sources for every installed OS package
        id: package_sources
        if: ${{ !cancelled() && steps.base_sources.outcome == 'success' && (inputs.qualification || success()) }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: set -o pipefail; python3 scripts/collect_package_sources.py --map docs/os-package-sources.json --architecture ${{ matrix.arch }} --runtime-inventory candidate-notices-${{ matrix.arch }}.json --output source-materials/packages | tee source-acquisition-packages-${{ matrix.arch }}.log
      - name: Verify rebuilt source distribution without retaining images
        if: ${{ inputs.qualification && !inputs.prepare_notices && !cancelled() && steps.package_sources.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 scripts/build_distribution_bundle.py --sources source-materials --architecture ${{ matrix.arch }} --runtime-inventory candidate-notices-${{ matrix.arch }}.json --output distribution | tee source-distribution-${{ matrix.arch }}.log
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          from release_materials import bundle
          _, proof = bundle('${{ matrix.arch }}', verify_files=True)
          pathlib.Path('distribution/source-bundle-${{ matrix.arch }}.json').write_text(json.dumps(proof, sort_keys=True) + '\n')
          print('Every corresponding-source member and rebuilt runtime notice verified.')
          PY
      - name: Package sources and notices for the exact tested runtime
        if: ${{ !inputs.qualification }}
        run: |
          set -o pipefail
          test -s candidate-notices-${{ matrix.arch }}.json
          python3 scripts/build_distribution_bundle.py --sources source-materials --architecture ${{ matrix.arch }} --runtime-inventory candidate-notices-${{ matrix.arch }}.json --output distribution | tee source-distribution-${{ matrix.arch }}.log
          cd distribution
          sha256sum --check keep-${{ steps.release.outputs.version }}-source-materials-${{ matrix.arch }}.tar.gz.sha256
      - name: Print source bundle manifest and compact summary
        if: ${{ !inputs.qualification }}
        run: python3 scripts/release_materials.py report ${{ matrix.arch }}
      - name: Prepare checked source notices for review
        if: ${{ inputs.qualification && inputs.prepare_notices && !cancelled() && steps.package_sources.outcome == 'success' }}
        run: python3 scripts/build_distribution_bundle.py --sources source-materials --architecture ${{ matrix.arch }} --runtime-inventory candidate-notices-${{ matrix.arch }}.json --prepare-notices --output notice-preparation
      - name: Retain small qualification records and notice bytes
        if: ${{ inputs.qualification && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-qualification-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            notice-preparation/os-notices/
            notice-preparation/notice-inputs/
            notice-preparation/NOTICE-PREPARATION.json
            distribution/source-bundle-${{ matrix.arch }}.json
            candidate-*${{ matrix.arch }}.json
            portable-recovery-${{ matrix.arch }}.json
            installer-trial-${{ matrix.arch }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain exact tested image, sources and original evidence
        if: ${{ !inputs.qualification }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validated_build.py retain ${{ matrix.arch }}
      - name: Retain immutable validation index
        if: ${{ !inputs.qualification }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: validated-build/${{ matrix.arch }}/index.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
